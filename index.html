<!doctype html>
<html lang="en">
  <script>
    //We create two const one for the max value and one for the min value, later whe use the getComputerChoice(1, 4) so it prints any number from 1 to 3
    // We store the computer Choice is the const Choice for later use, we get the result by using MathFloor and them Math.Random to get the values within the min and max malues
    function getComputerChoice(min, max) {
      const minCeiled = Math.ceil(min);
      const maxFloored = Math.floor(max);

      const choice = Math.floor(
        Math.random() * (maxFloored - minCeiled) + minCeiled,
      );

      let ComputerChoice = "";

      if (choice === 1) {
        ComputerChoice = "Rock";
      } else if (choice === 2) {
        ComputerChoice = "Paper";
      } else if (choice === 3) {
        ComputerChoice = "Scissors";
      }

      return ComputerChoice;
    }

    function getHumanChoice() {
      // We use let cause the value of let can be changed later  not like const
      //Put the Prompt inside of the Variable so it stores de question answer
      let HumanChoice = prompt("Choose Rock Paper or Scissors");

      if (HumanChoice === "Rock") {
        HumanChoice = "Rock";
      } else if (HumanChoice === "Paper") {
        HumanChoice = "Paper";
      } else if (HumanChoice === "Scissors") {
        HumanChoice = "Scissors";
      }

      return HumanChoice;
    }

    function playGame() {
      // set both scores to Zero so later in the PlayRound it can be changed when using the result and the ++.
      let humanScore = 0;
      let computerScore = 0;

      function PlayRound(humanChoice, ComputerChoice) {
        if (humanChoice === "Rock" && ComputerChoice === "Scissors") {
          humanScore++;
        } else if (humanChoice === "Paper" && ComputerChoice === "Rock") {
          humanScore++;
        } else if (humanChoice === "Scissors" && ComputerChoice === "Paper") {
          humanScore++;
        } else if (ComputerChoice === "Rock" && humanChoice === "Scissors") {
          computerScore++;
        } else if (ComputerChoice === "Paper" && humanChoice === "Rock") {
          computerScore++;
        } else if (ComputerChoice === "Scissors" && humanChoice === "Paper") {
          computerScore++;
        }
      }
      //Play 5 rounds  and them print the result
      PlayRound(getHumanChoice(), getComputerChoice(1, 4));
      PlayRound(getHumanChoice(), getComputerChoice(1, 4));
      PlayRound(getHumanChoice(), getComputerChoice(1, 4));
      PlayRound(getHumanChoice(), getComputerChoice(1, 4));
      PlayRound(getHumanChoice(), getComputerChoice(1, 4));

      console.log("Human Score:", humanScore);
      console.log("Computer Score:", computerScore);
    }

    playGame();
  </script>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
  </head>

  <body></body>
</html>
